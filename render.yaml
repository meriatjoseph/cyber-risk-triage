services:
  - type: web
    name: tawasolpay-risk-assistant
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 8000
      - key: GROQ_API_KEY
        sync: false
      - key: REFRESH_TOKEN
        generateValue: true
    healthCheckPath: /health
